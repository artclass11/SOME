name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest -q
      - name: Validate frontend JavaScript
        run: node --check src/some/static/app.js
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Verify packaged web assets
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {"some/static/index.html", "some/static/app.js"}
          missing = required - names
          assert not missing, f"Wheel is missing web assets: {sorted(missing)}"
          PY
